# Add these blocks to supabase/config.toml in the admin project.
#
# Every Mail function checks who is calling inside its own code:
#   mail-api and mail-auth verify the admin login themselves,
#   mail-auth also receives the redirect back from Google, which has no admin login,
#   mail-push is called by Google Pub/Sub and checks MAIL_PUSH_TOKEN,
#   mail-cron is called by pg_cron and checks MAIL_CRON_SECRET.
# So the platform's own JWT check is turned off for all four.

[functions.mail-api]
verify_jwt = false

[functions.mail-auth]
verify_jwt = false

[functions.mail-push]
verify_jwt = false

[functions.mail-cron]
verify_jwt = false
